server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: rutas del lado del cliente (redirect a index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache estática de assets con hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
